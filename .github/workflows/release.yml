name: Installationspaket veröffentlichen

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Vorhandenes Versions-Tag, z. B. v0.10.2
        required: true
        type: string
      prerelease:
        description: Als Vorabversion kennzeichnen
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: github-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Version und Tag prüfen
        run: |
          node -e 'const v=require("./package.json").version;if(process.env.RELEASE_TAG!=="v"+v)throw Error("Tag passt nicht zur Paketversion")'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run test:integration
      - name: Paket und Prüfsumme bauen
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          VERSION=$(node -p 'require("./package.json").version')
          git archive --format=zip --prefix="ioBroker.energiemanagement-v$VERSION/" \
            --output="dist/ioBroker.energiemanagement-v$VERSION-projekt.zip" HEAD
          cp "docs/releases/v$VERSION.md" "dist/Energiemanagement-v$VERSION-Kurzbericht.txt"
          cd dist
          sha256sum *.tgz *.zip *-Kurzbericht.txt > SHA256SUMS.txt
          for file in *.tgz *.zip; do sha256sum "$file" > "$file.sha256"; done
      - name: GitHub-Entwurf mit Installationsdateien bereitstellen
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
            if [ "$IS_DRAFT" != true ]; then
              echo "Version ist bereits öffentlich. Bestehende Dateien bleiben erhalten."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Energiemanagement $RELEASE_TAG" --generate-notes
          fi
          gh release edit "$RELEASE_TAG" --draft --prerelease="$PRERELEASE"
          gh release upload "$RELEASE_TAG" dist/* --clobber
          echo "Entwurf bereit. Prüfsummen und Downloads vor der Veröffentlichung prüfen."
